[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-agent"
version = "0.2.0"
description = "Evidence-first AI work receipts and verification for agents (MCP adapter included)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    # mcp 2.x requires starlette>=1.7, so fastapi must stay on a compatible line.
    "fastapi>=0.141.0",
    "uvicorn>=0.23.0",
    "mcp>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
pdf = ["pypdf>=5.0"]

[project.scripts]
evidence-agent = "evidence_first.cli.main:main"
evidence-first = "evidence_first.cli.main:evidence_first_main"

[tool.setuptools.packages.find]
include = ["evidence_first*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
