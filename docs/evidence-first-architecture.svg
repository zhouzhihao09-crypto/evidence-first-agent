<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <linearGradient id="grad-planner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3182ce;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-executor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38a169;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#276749;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-verifier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d69e2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#975a16;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-store" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#805ad5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6b46c1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-graph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e53e3e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c53030;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-ui" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b5d8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0987a0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-approval" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ed8936;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c05621;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-task" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#1a202c" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Evidence-First Agent</text>
  <text x="450" y="55" text-anchor="middle" fill="#a0aec0" font-size="11">AI agents that don't just act - they prove what they did</text>

  <!-- Task -->
  <rect x="360" y="70" width="180" height="40" rx="6" fill="url(#grad-task)" stroke="#4a5568" stroke-width="1"/>
  <text x="450" y="95" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">TASK</text>

  <line x1="450" y1="110" x2="450" y2="140" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Planner -->
  <rect x="310" y="140" width="200" height="44" rx="6" fill="url(#grad-planner)" stroke="#63b3ed" stroke-width="1.5"/>
  <text x="410" y="167" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Planner</text>
  <text x="410" y="178" text-anchor="middle" fill="#bee3f8" font-size="9">Verification Steps</text>

  <line x1="410" y1="184" x2="410" y2="220" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Executor -->
  <rect x="260" y="220" width="300" height="44" rx="6" fill="url(#grad-executor)" stroke="#68d391" stroke-width="1.5"/>
  <text x="410" y="247" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Executor</text>
  <text x="410" y="258" text-anchor="middle" fill="#c6f6d5" font-size="9">Run Search Read Analyze</text>

  <!-- Tools branch -->
  <line x1="370" y1="264" x2="370" y2="300" stroke="#4a5568" stroke-width="1"/>
  <line x1="370" y1="300" x2="260" y2="300" stroke="#4a5568" stroke-width="1"/>
  <line x1="260" y1="300" x2="260" y2="330" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="370" y1="300" x2="410" y2="330" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="410" y1="300" x2="460" y2="330" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="460" y1="300" x2="560" y2="330" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="225" y="330" width="70" height="28" rx="4" fill="#2d3748" stroke="#4a5568"/>
  <text x="260" y="348" text-anchor="middle" fill="#a0aec0" font-size="9">Search</text>
  <rect x="375" y="330" width="70" height="28" rx="4" fill="#2d3748" stroke="#4a5568"/>
  <text x="410" y="348" text-anchor="middle" fill="#a0aec0" font-size="9">Filesystem</text>
  <rect x="430" y="330" width="70" height="28" rx="4" fill="#2d3748" stroke="#4a5568"/>
  <text x="465" y="348" text-anchor="middle" fill="#a0aec0" font-size="9">Filesystem</text>
  <rect x="525" y="330" width="70" height="28" rx="4" fill="#2d3748" stroke="#4a5568"/>
  <text x="560" y="348" text-anchor="middle" fill="#a0aec0" font-size="9">HTTP</text>

  <!-- Observations connection -->
  <line x1="410" y1="264" x2="410" y2="380" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Verifier -->
  <rect x="280" y="380" width="260" height="44" rx="6" fill="url(#grad-verifier)" stroke="#f6e05e" stroke-width="1.5"/>
  <text x="410" y="407" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Verifier</text>
  <text x="410" y="418" text-anchor="middle" fill="#fefcbf" font-size="9">Deterministic Rules</text>

  <!-- Evidence Recorder -->
  <line x1="410" y1="424" x2="410" y2="460" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="460" width="240" height="44" rx="6" fill="url(#grad-store)" stroke="#b794f4" stroke-width="1.5"/>
  <text x="410" y="487" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Evidence Recorder</text>
  <text x="410" y="498" text-anchor="middle" fill="#e9d8fd" font-size="9">Records Action/Obs/Evidence</text>

  <!-- Evidence Store -->
  <line x1="410" y1="504" x2="410" y2="540" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="540" width="260" height="44" rx="6" fill="#553c9a" stroke="#9f7aea" stroke-width="1.5"/>
  <text x="410" y="567" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Evidence Store (SQLite)</text>
  <text x="410" y="578" text-anchor="middle" fill="#d6bcfa" font-size="9">Persistent Audit Trail</text>

  <!-- Evidence Graph -->
  <line x1="410" y1="584" x2="410" y2="620" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="620" width="240" height="36" rx="6" fill="url(#grad-graph)" stroke="#fc8181" stroke-width="1.5"/>
  <text x="410" y="643" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Evidence Graph</text>

  <!-- Branch: Conclusion and Approval -->
  <line x1="410" y1="460" x2="200" y2="460" stroke="#4a5568" stroke-width="1"/>
  <line x1="410" y1="460" x2="620" y2="460" stroke="#4a5568" stroke-width="1"/>
  <line x1="200" y1="460" x2="200" y2="490" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="460" x2="620" y2="490" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Conclusion -->
  <rect x="130" y="490" width="140" height="36" rx="6" fill="#2b6cb0" stroke="#63b3ed"/>
  <text x="200" y="513" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Conclusion</text>

  <!-- Approval -->
  <rect x="550" y="490" width="140" height="36" rx="6" fill="url(#grad-approval)" stroke="#f6ad55"/>
  <text x="620" y="513" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Human Approval</text>
  <text x="620" y="523" text-anchor="middle" fill="#feebc8" font-size="8">When Required</text>

  <!-- UI Branch -->
  <line x1="410" y1="638" x2="180" y2="670" stroke="#4a5568" stroke-width="1"/>
  <line x1="410" y1="638" x2="640" y2="670" stroke="#4a5568" stroke-width="1"/>

  <rect x="100" y="668" width="160" height="28" rx="5" fill="url(#grad-ui)" stroke="#4fd1c5"/>
  <text x="180" y="686" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">CLI / Web UI</text>

  <rect x="600" y="668" width="160" height="28" rx="5" fill="#2d3748" stroke="#4a5568"/>
  <text x="680" y="686" text-anchor="middle" fill="#a0aec0" font-size="10">Dashboard</text>
</svg>
